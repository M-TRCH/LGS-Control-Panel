; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
upload_protocol = stlink
monitor_speed = 9600 ; Set the monitor speed to match the Serial3 baud rate
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    arduino-libraries/ArduinoModbus@^1.0.9
    bodmer/TFT_eSPI @ ^2.5.43
    ; Touchscreen library removed — touch disabled in code

; build_flags =
;     -D USER_SETUP_LOADED=1
;     -D ILI9488_DRIVER=1
;     -D TFT_MISO=PA6
;     -D TFT_MOSI=PA7
;     -D TFT_SCLK=PA5
;     -D TFT_CS=PB12
;     -D TFT_DC=-1
;     -D TFT_RST=-1
;     -D TOUCH_CS=PC4
;     -D SPI_FREQUENCY=27000000
;     -D SPI_READ_FREQUENCY=20000000
;     -D SPI_TOUCH_FREQUENCY=2500000


build_flags =
    ; บอก Library ว่าเราจะตั้งค่าเองที่นี่ ไม่ต้องไปอ่านไฟล์ header
    -D USER_SETUP_LOADED=1
    
    ; --- 1. เลือก Driver จอ ---
    -D ILI9488_DRIVER=1
    
    ; --- 2. กำหนดขา (ต้องตรงกับที่ต่อจริง 100%) ---
    -D TFT_MISO=PA6   ; จำเป็นสำหรับ Touch และการอ่านค่าจากจอ
    -D TFT_MOSI=PA7
    -D TFT_SCLK=PA5
    -D TFT_CS=PB12
    -D TFT_DC=PB3     ; Data/Command
    -D TFT_RST=PB4    ; Reset
    
    ; --- 3. ตั้งค่าความเร็ว SPI ---
    ; 27MHz เป็นค่าที่เสถียรสำหรับ ILI9488 บนสายไฟ jumper ทั่วไป
    ; ถ้าภาพแตกหรือจอขาว ให้ลดเหลือ 20000000 (20MHz)
    -D SPI_FREQUENCY=27000000
    
    ; ความเร็วตอนอ่านข้อมูลกลับ (เช่น อ่านพิกัดสี) ต้องช้าลง
    -D SPI_READ_FREQUENCY=20000000
    
    ; ความเร็วสำหรับ Touch Screen (ถ้าใช้ผ่าน TFT_eSPI)
    -D SPI_TOUCH_FREQUENCY=2500000
    
    ; --- 4. โหลด Font (เพื่อให้แสดงข้อความได้สวยๆ) ---
    -D LOAD_GLCD=1    ; Font มาตรฐาน
    -D LOAD_FONT2=1   ; Font ขนาดกลาง
    -D LOAD_FONT4=1   ; Font ตัวเลขขนาดใหญ่
    -D LOAD_FONT6=1   ; Font ตัวเลขขนาดใหญ่มาก
    -D LOAD_GFXFF=1   ; รองรับ FreeFonts
    -D SMOOTH_FONT=1  ; รองรับ Anti-aliasing